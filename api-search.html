<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nermeen Bolous | Recipe Search</title>
    <style>
        /* Using your portfolio's exact CSS themes [cite: 110-115] */
        body { font-family: Arial, sans-serif; line-height: 1.6; margin: 0; padding: 0; color: #333; background: #f4f4f4; }
        header { background: #2c3e50; color: white; padding: 2rem; text-align: center; }
        nav { background: #34495e; padding: 10px; text-align: center; position: sticky; top: 0; z-index: 1000; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
        .container { width: 85%; max-width: 1000px; margin: 20px auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        
        /* UI Styles [cite: 121-125] */
        .search-section { text-align: center; margin-bottom: 30px; }
        input { padding: 10px; width: 60%; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        button { padding: 10px 20px; background: #2c3e50; color: white; border: none; cursor: pointer; border-radius: 4px; font-size: 1rem; }
        button:hover { background: #1a252f; }
        #status { margin: 15px 0; font-weight: bold; min-height: 24px; color: #2c3e50; }
        
        /* Grid for results [cite: 119] */
        #results { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .recipe-card { background: #fff; border: 1px solid #ddd; padding: 20px; border-radius: 5px; text-align: center; }
        .recipe-card img { width: 100%; border-radius: 5px; height: 200px; object-fit: cover; margin-bottom: 10px; }
        footer { background: #2c3e50; color: white; text-align: center; padding: 2rem; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>Nermeen Bolous</h1>
        <p>IT-Web Design Specialist | Recipe Search Project</p>
    </header>

    <nav>
        <a href="index.html">Main Portfolio</a>
    </nav>

    <main class="container">
        <section class="search-section">
            <h2>Recipe Discovery</h2>
            <p>Type a food name to pull data from a public API.</p>
            <input type="text" id="searchInput" placeholder="Search for a recipe (e.g. Beef)...">
            <button id="searchBtn">Search</button>
            <div id="status"></div>
        </section>

        <div id="results"></div>
    </main>

    <footer>
        <p>&copy; 2026 Nermeen Bolous. All rights reserved.</p>
    </footer>
<script>
    const searchBtn = document.getElementById("searchBtn");
    const searchInput = document.getElementById("searchInput");
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    searchBtn.addEventListener("click", runSearch);

    // Allow the user to press 'Enter' to search
    searchInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") runSearch();
    });

    async function runSearch() {
        const term = searchInput.value.trim();

        if (!term) {
            status.textContent = "Please enter a search term.";
            results.innerHTML = "";
            return;
        }

        status.textContent = "Connecting to recipe database...";
        results.innerHTML = "";

        try {
            // Using a timestamp (?t=) helps bypass some browser security/cache blocks
            
            const url = `https://www.themealdb.com/api/json/v1/1/search.php?s=${encodeURIComponent(term)}`;

                method: 'GET',
                headers: {
                    'Accept': 'application/json'
                }
            });

            if (!response.ok) {
                throw new Error("Network response was not ok");
            }

            const data = await response.json();

            if (!data.meals) {
                status.textContent = "No recipes found. Try searching for 'Chicken' or 'Pizza'.";
                return;
            }

            status.textContent = `Success! Found ${data.meals.length} result(s).`;

            // Display Name, Category, Region, and Image
            results.innerHTML = data.meals.map(meal => `
                <div class="recipe-card">
                    <img src="${meal.strMealThumb}" alt="${meal.strMeal}" loading="lazy">
                    <h3>${meal.strMeal}</h3>
                    <p><strong>Category:</strong> ${meal.strCategory}</p>
                    <p><strong>Region:</strong> ${meal.strArea}</p>
                </div>
            `).join("");

        } catch (error) {
            status.textContent = "Connection blocked by browser. Check your internet or ad-blocker.";
            console.error("Technical Detail:", error);
        }
    }
</script>
</body>
</html>
