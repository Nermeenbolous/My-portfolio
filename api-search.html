<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder</title>
    <link rel="stylesheet" href="api-search.css">
</head>
<body>
    <div class="container">
        <h1>Recipe Finder</h1>
        <p>Search for your favorite meals (e.g., "Pizza", "Pasta", or "Cake").</p>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Enter meal name...">
            <button id="searchBtn">Search</button>
        </div>

        <p id="status"></p>
        <div id="results" class="results-grid"></div>
    </div>

    <script src="api-search.js"></script>
</body>
</html>
