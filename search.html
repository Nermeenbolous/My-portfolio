
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Search | Nermeen Bolous</title>
    <style>
        /* Matching your portfolio's theme */
        body { font-family: Arial, sans-serif; line-height: 1.6; margin: 0; padding: 0; color: #333; background: #f4f4f4; }
        header { background: #2c3e50; color: white; padding: 2rem; text-align: center; }
        .container { width: 80%; margin: 20px auto; overflow: hidden; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        
        /* Search UI Styles */
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #2c3e50; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #1a252f; }
        
        /* Result Card Styles */
        #status { font-weight: bold; margin-bottom: 15px; }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .meal-card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; text-align: center; background: #fff; }
        .meal-card img { max-width: 100%; border-radius: 5px; height: auto; }
        .back-link { display: block; margin-top: 20px; color: #2c3e50; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1>Recipe Finder</h1>
    <p>Search for delicious meals using TheMealDB API</p>
</header>

<main class="container">
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Enter a meal (e.g., chicken, pasta)...">
        <button id="searchBtn">Search</button>
    </div>

    <p id="status"></p>
    <div id="results" class="results-grid"></div>

    <a href="index.html" class="back-link">← Back to Portfolio</a>
</main>

<script>
    // JavaScript Logic will go here (Step 3)
</script>

</body>
</html>
