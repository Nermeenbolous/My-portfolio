<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recipe Search | Nermeen Bolous</title>
    <style>
        /* This makes your page look professional */
        body { font-family: Arial; background: #f4f4f4; text-align: center; padding: 20px; }
        .container { background: white; max-width: 800px; margin: auto; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { padding: 10px; width: 60%; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #2c3e50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #results { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
        .card { border: 1px solid #ddd; margin: 10px; padding: 10px; width: 200px; border-radius: 8px; background: #fff; }
        img { width: 100%; border-radius: 5px; }
        .back-link { display: block; margin-top: 20px; text-decoration: none; color: #2c3e50; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Recipe Finder</h1>
    <p>Search for a meal (like "pasta" or "chicken") to see details from the API.</p>
    
    <input type="text" id="searchInput" placeholder="Type here...">
    <button id="searchBtn">Search</button>

    <p id="status"></p> <div id="results"></div> <a href="index.html" class="back-link">← Back to My Portfolio</a>
</div>

<script>
const searchBtn = document.getElementById("searchBtn");
const searchInput = document.getElementById("searchInput");
const status = document.getElementById("status");
const results = document.getElementById("results");

searchBtn.addEventListener("click", async () => {
    const term = searchInput.value.trim();

    // 1. Error handling for empty search
    if (!term) {
        status.textContent = "Please type a word first.";
        return;
    }

    // 2. Loading State
    status.textContent = "Loading recipes...";
    results.innerHTML = "";

    try {
        // 3. Fetching the data
        const response = await fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${term}`);
        const data = await response.json();

        if (!data.meals) {
            status.textContent = "No recipes found. Try another word!";
        } else {
            status.textContent = `Found ${data.meals.length} recipes!`;
            
            // 4. Displaying the results
            data.meals.forEach(meal => {
                results.innerHTML += `
                    <div class="card">
                        <img src="${meal.strMealThumb}">
                        <h3>${meal.strMeal}</h3>
                        <p>Category: ${meal.strCategory}</p>
                        <p>Area: ${meal.strArea}</p>
                    </div>`;
            });
        }
    } catch (error) {
        status.textContent = "Something went wrong. Check your connection.";
    }
});</script>

</body>
</html>
